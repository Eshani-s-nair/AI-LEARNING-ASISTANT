<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StudySmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

    <style>
        h1, h2, h3, h4, h5, .navbar-brand {
            font-family: 'Playfair Display', serif;
        }
        .btn { border-radius: 50px !important; }
        .card { border-radius: 1.25rem !important; }

        .toggle-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        [data-bs-theme="dark"] .toggle-thumb {
            transform: translateX(14px);
        }
    </style>
</head>
<body class="bg-body">

<!-- NAVBAR -->
<nav class="navbar border-bottom bg-body shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold fs-4" href="#">StudySmart</a>

        <button id="themeToggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2 px-3 py-2">
            <span id="themeIcon">🌙</span>
            <div class="d-flex align-items-center bg-secondary-subtle rounded-pill px-1" style="width:34px;height:20px;">
                <div class="toggle-thumb bg-secondary"></div>
            </div>
            <span id="themeLabel">Dark</span>
        </button>
    </div>
</nav>

<!-- SIGN UP SECTION -->
<section class="py-5 bg-body min-vh-100 d-flex align-items-center">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6 col-xl-5">

                <div class="card border-0 shadow-lg p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h4 class="fw-bold mb-1">Create your account</h4>
                        <p class="text-secondary small mb-0">Start studying smarter with StudySmart</p>
                    </div>

                    <div id="signupError" class="alert alert-danger py-2 small d-none" role="alert"></div>
                    <div id="signupSuccess" class="alert alert-success py-2 small d-none" role="alert">
                        Account created successfully! Redirecting…
                    </div>

                    <form id="signupForm">

                        <!-- Name row -->
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">First Name</label>
                                <input type="text" id="firstName" class="form-control" placeholder="Enter your first name">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">Last Name</label>
                                <input type="text" id="lastName" class="form-control" placeholder="Enter your last name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="you@example.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="your_username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••">
                            <div class="form-text">Minimum 8 characters.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold text-uppercase" style="letter-spacing:.05em;">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Create Account</button>

                    </form>

                    <hr class="my-4">
                    <p class="text-center text-secondary small mb-0">
                        Already have an account? <a href="home.html#login" class="text-body fw-semibold">Login here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ── THEME ──
    const html = document.documentElement;
    applyTheme(localStorage.getItem('prepmate-theme') || 'light');
    document.getElementById('themeToggle').addEventListener('click', () => {
        applyTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');
    });
    function applyTheme(t) {
        html.setAttribute('data-bs-theme', t);
        localStorage.setItem('prepmate-theme', t);
        document.getElementById('themeIcon').textContent  = t === 'dark' ? '☀️' : '🌙';
        document.getElementById('themeLabel').textContent = t === 'dark' ? 'Light' : 'Dark';
    }

    // ── SIGNUP FORM ──
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const errEl = document.getElementById('signupError');
        const successEl = document.getElementById('signupSuccess');
        const submitBtn = this.querySelector('button[type="submit"]');
        errEl.classList.add('d-none');
        successEl.classList.add('d-none');

        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const email     = document.getElementById('email').value.trim();
        const username  = document.getElementById('username').value.trim();
        const password  = document.getElementById('password').value;
        const confirm   = document.getElementById('confirmPassword').value;

        // --- Client-side validation ---
        if (!firstName || !lastName) {
            errEl.textContent = 'Please enter your first and last name.';
            return errEl.classList.remove('d-none');
        }
        if (!email || !email.includes('@')) {
            errEl.textContent = 'Please enter a valid email address.';
            return errEl.classList.remove('d-none');
        }
        if (!username) {
            errEl.textContent = 'Please choose a username.';
            return errEl.classList.remove('d-none');
        }
        if (password.length < 8) {
            errEl.textContent = 'Password must be at least 8 characters.';
            return errEl.classList.remove('d-none');
        }
        if (password !== confirm) {
            errEl.textContent = 'Passwords do not match.';
            return errEl.classList.remove('d-none');
        }

        // --- API Call ---
        const originalButtonText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating...`;

        try {
            const response = await fetch('http://127.0.0.1:5000/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, email, username, password }),
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'An unknown error occurred.');

            successEl.classList.remove('d-none');
            setTimeout(() => { window.location.href = 'home.html'; }, 1800);

        } catch (error) {
            if (error.message === 'Failed to fetch') {
                errEl.textContent = 'Unable to connect to server. Is server.py running?';
            } else {
                errEl.textContent = error.message;
            }
            errEl.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalButtonText;
        }
    });
</script>

</body>
</html>
