<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Playfair Display', serif; }

        .accordion-item { border-radius: 1rem !important; overflow: hidden; border: none; margin-bottom: 1rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
        .accordion-button:not(.collapsed) { background-color: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); }
        .question-item { border-left: 4px solid #0d6efd; padding-left: 1rem; margin-bottom: 1.5rem; }
        .ai-answer-box { background-color: var(--bs-tertiary-bg); border-radius: 0.75rem; padding: 1rem; margin-top: 1rem; border-left: 4px solid #198754; display: none; }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 40% { color: #222; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .25em 0 0 #222, .5em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .25em 0 0 #222, .5em 0 0 #222; } }
        /* ── AI Answer Formatting ────────────────────────────── */
.ai-answer-box { font-size: 0.875rem; line-height: 1.7; }

.ai-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--bs-emphasis-color);
    border-bottom: 2px solid var(--bs-primary);
    padding-bottom: 4px;
}
.ai-heading {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--bs-primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.ai-subheading {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--bs-secondary-color);
}
.ai-para {
    margin: 0;
    color: var(--bs-body-color);
}
.ai-list {
    padding-left: 1.4rem;
    margin: 0.25rem 0;
    color: var(--bs-body-color);
}
.ai-list li {
    margin-bottom: 0.3rem;
}
.ai-spacer { height: 0.5rem; }
.ai-divider {
    border: none;
    border-top: 1px solid var(--bs-border-color);
    margin: 0.75rem 0;
}

/* Code blocks */
.code-block-wrapper {
    border-radius: 0.6rem;
    overflow: hidden;
    border: 1px solid var(--bs-border-color);
    background: #1e1e2e;
}
.code-lang-label {
    background: #2a2a3d;
    color: #a0a0c0;
    font-size: 0.7rem;
    font-family: monospace;
    padding: 4px 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}
.ai-code-block {
    margin: 0;
    padding: 1rem 1.2rem;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre;
    tab-size: 4;
}

/* Inline code */
.ai-inline-code {
    background: var(--bs-secondary-bg);
    color: #e06c75;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.82em;
    border: 1px solid var(--bs-border-color);
}
    </style>
</head>
<body class="bg-body-tertiary">
    <!-- Navbar -->
    <nav class="navbar border-bottom bg-body shadow-sm sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-4 mb-0" href="home.html">SmartStudy</a>
            <div class="d-flex gap-2">
                <a href="summary.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Summary Hub</a>
                <a href="upload.html" class="btn btn-dark btn-sm rounded-pill px-3">New Analysis</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Important Questions</h1>
            <p class="text-secondary max-width-600 mx-auto">
                The following questions were extracted from your previous year papers and ranked based on topic relevance and frequency of occurrence.
            </p>
        </div>

        <div id="questions-container" class="accordion col-lg-10 mx-auto">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.write('<script src="refined_questions_data.js?v=' + Date.now() + '"><\/script>');
    </script>
    <script>
        let topicData = [];
        function formatAIAnswer(text) {
    // Split into lines for processing
    let lines = text.split('\n');
    let html = '';
    let inCode = false;
    let inList = false;
    let codeBuffer = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // ── CODE BLOCK (triple backtick) ──────────────────────────
        if (line.trim().startsWith('```')) {
            if (!inCode) {
                // Opening fence — grab optional language label
                if (inList) { html += '</ul>'; inList = false; }
                const lang = line.trim().replace('```', '').trim() || 'text';
                html += `<div class="code-block-wrapper mt-2 mb-3">
                            <div class="code-lang-label">${lang}</div>
                            <pre class="ai-code-block"><code>`;
                inCode = true;
            } else {
                // Closing fence
                html += `</code></pre></div>`;
                inCode = false;
            }
            continue;
        }

        if (inCode) {
            // Escape HTML inside code blocks
            html += escapeHTML(line) + '\n';
            continue;
        }

        // ── INLINE CODE (single backtick) ─────────────────────────
        line = line.replace(/`([^`]+)`/g,
            '<code class="ai-inline-code">$1</code>');

        // ── BOLD (**text**) ───────────────────────────────────────
        line = line.replace(/\*\*(.+?)\*\*/g,
            '<strong>$1</strong>');

        // ── ITALIC (*text*) ───────────────────────────────────────
        line = line.replace(/\*(.+?)\*/g,
            '<em>$1</em>');

        // ── HEADINGS (## or ###) ──────────────────────────────────
        if (/^###\s+/.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p class="ai-subheading mt-3 mb-1">${line.replace(/^###\s+/, '')}</p>`;
            continue;
        }
        if (/^##\s+/.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p class="ai-heading mt-3 mb-1">${line.replace(/^##\s+/, '')}</p>`;
            continue;
        }
        if (/^#\s+/.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p class="ai-title mt-3 mb-2">${line.replace(/^#\s+/, '')}</p>`;
            continue;
        }

        // ── BULLET POINTS (-, *, •) ───────────────────────────────
        if (/^[\-\*•]\s+/.test(line.trim())) {
            if (!inList) { html += '<ul class="ai-list mt-1 mb-1">'; inList = true; }
            const item = line.trim().replace(/^[\-\*•]\s+/, '');
            html += `<li>${item}</li>`;
            continue;
        }

        // ── NUMBERED LIST ─────────────────────────────────────────
        if (/^\d+\.\s+/.test(line.trim())) {
            if (inList) { html += '</ul>'; inList = false; }
            const item = line.trim().replace(/^\d+\.\s+/, '');
            // Start ordered list only once
            if (i === 0 || !/^\d+\.\s+/.test(lines[i-1].trim())) {
                html += '<ol class="ai-list mt-1 mb-1">';
            }
            html += `<li>${item}</li>`;
            // Close ordered list if next line isn't numbered
            if (i === lines.length - 1 || !/^\d+\.\s+/.test(lines[i+1].trim())) {
                html += '</ol>';
            }
            continue;
        }

        // ── HORIZONTAL RULE (---) ─────────────────────────────────
        if (/^---+$/.test(line.trim())) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<hr class="ai-divider">';
            continue;
        }

        // ── EMPTY LINE → paragraph break ─────────────────────────
        if (line.trim() === '') {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<div class="ai-spacer"></div>';
            continue;
        }

        // ── PLAIN TEXT ────────────────────────────────────────────
        if (inList) { html += '</ul>'; inList = false; }
        html += `<p class="ai-para mb-1">${line}</p>`;
    }

    // Close any open tags
    if (inList) html += '</ul>';
    if (inCode) html += '</code></pre></div>';

    return html;
}
        async function askAI(topicIdx, qIdx, targetId) {
            const q = topicData[topicIdx].questions[qIdx];
            const question = q.text;
            const topic = topicData[topicIdx].topic;

            const user = JSON.parse(localStorage.getItem('prepmate_user'));
            const userId = user ? user.id : null;
            const btn = document.querySelector(`button[data-target="${targetId}"]`);
            const answerBox = document.getElementById(`answer-${targetId}`);
            const content = document.getElementById(`content-${targetId}`);
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Thinking...';
            answerBox.style.display = 'block';
            content.innerHTML = '<p class="text-muted italic loading-dots">Generating comprehensive answer</p>';

            try {
                const response = await fetch('http://127.0.0.1:5000/get-ai-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, topic, user_id: userId })
                });
                const data = await response.json();
                
                if (data.answer) {
                    content.innerHTML = formatAIAnswer(data.answer);
                } else if (data.error) {
                    content.innerHTML = `<p class="text-danger">AI Error: ${data.error}</p>`;
                } else {
                    content.innerHTML = '<p class="text-danger">Failed to get an answer. Is Ollama running?</p>';
                }
            } catch (err) {
                content.innerHTML = '<p class="text-danger">Error connecting to AI service.</p>';
            } finally {
                btn.innerHTML = 'Ask AI Again';
                btn.disabled = false;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('questions-container');
            
            if (typeof generatedRefinedQuestions !== 'undefined') {
                topicData = generatedRefinedQuestions;
            } else {
                const stored = sessionStorage.getItem('prepmate_important_questions');
                if (stored) topicData = JSON.parse(stored);
            }

            if (!topicData || topicData.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5"><p class="fs-5">No question paper data found. Please upload PDF papers in the upload section.</p></div>';
                return;
            }

            container.innerHTML = '';
            topicData.forEach((item, index) => {
                const topicId = `topic-${index}`;
                const accordionItem = document.createElement('div');
                accordionItem.className = 'accordion-item shadow-sm';
                
                const questionsHtml = item.questions.map((q, qIdx) => {
                    const qId = `q-${index}-${qIdx}`;
                    const displayText = escapeHTML(q.text);
                    return `
                        <div class="question-item">
                            <div class="d-flex justify-content-between align-items-start gap-3">
                                <div>
                                    <p class="fw-bold mb-1">${displayText}</p>
                                    <div class="d-flex gap-2 mb-2">
                                        <span class="badge bg-success-subtle text-success small">Repeated ${q.occurrence_count}x</span>
                                    </div>
                                </div>
                                <button class="btn btn-sm btn-dark rounded-pill px-3 flex-shrink-0" 
                                        data-target="${qId}"
                                        onclick="askAI(${index}, ${qIdx}, '${qId}')">
                                    Ask AI
                                </button>
                            </div>
                            <div id="answer-${qId}" class="ai-answer-box">
                                <h6 class="fw-bold mb-2 small text-success">AI Generated Answer:</h6>
                                <div id="content-${qId}" class="small text-secondary"></div>
                            </div>
                        </div>`;
                }).join('');

                accordionItem.innerHTML = `
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#${topicId}">
                            <div class="d-flex justify-content-between w-100 align-items-center pe-3">
                                <span>${item.topic.toUpperCase()}</span>
                                <div class="d-flex gap-2">
                                    <span class="badge bg-info-subtle text-info rounded-pill fw-normal" style="font-size: 0.7rem;">Topic Freq: ${item.frequency}</span>
                                    <span class="badge bg-warning-subtle text-warning-emphasis rounded-pill fw-normal" style="font-size: 0.7rem;">Importance: ${item.importance_score}</span>
                                    <span class="badge bg-secondary rounded-pill fw-normal" style="font-size: 0.7rem;">${item.questions.length} Questions</span>
                                </div>
                            </div>
                        </button>
                    </h2>
                    <div id="${topicId}" class="accordion-collapse collapse" data-bs-parent="#questions-container">
                        <div class="accordion-body bg-white">
                            ${questionsHtml}
                        </div>
                    </div>
                `;
                container.appendChild(accordionItem);
            });
        });
    </script>
</body>
</html>
