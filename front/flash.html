<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards - StudySmart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
    h1, h2, h3, h4, h5, .navbar-brand { font-family: 'Playfair Display', serif; font-weight: 700; }
    body { font-family: 'DM Sans', sans-serif; line-height: 1.6; }
    .btn  { border-radius: 50px !important; }

    .toggle-thumb {
        width: 14px; height: 14px;
        border-radius: 50%;
        transition: transform 0.3s ease;
    }
    [data-bs-theme="dark"] .toggle-thumb { transform: translateX(14px); }

    /* Flashcard flip effect */
    .flashcard-container {
        perspective: 1000px;
    }

    .flashcard {
        width: 100%;
        height: 350px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
        cursor: pointer;
    }

    .flashcard.flip {
        transform: rotateY(180deg);
    }

    .flashcard-front,
    .flashcard-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        background: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        color: var(--bs-body-color);
    }

    .flashcard-back {
        transform: rotateY(180deg);
    }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar border-bottom bg-body shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <a href="summary.html" class="btn btn-outline-secondary btn-sm px-3" title="Back to Summary">← Summary</a>
            <a href="upload.html" class="btn btn-outline-primary btn-sm px-3">Back to Upload</a>
            <a class="navbar-brand fw-bold fs-4 mb-0" href="#">StudySmart</a>
        </div>

        <button id="themeToggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2 px-3 py-2">
            <span id="themeIcon">🌙</span>
            <div class="d-flex align-items-center bg-secondary-subtle rounded-pill px-1" style="width:34px;height:20px;">
                <div class="toggle-thumb bg-secondary"></div>
            </div>
            <span id="themeLabel">Dark</span>
        </button>
    </div>
</nav>

<div class="container py-5">

    <!-- PAGE HEADING -->
    <div class="text-center mb-5">
        <h1 class="fw-bold">Flashcards</h1>
        <p class="text-secondary">Click the card to flip and reveal the answer.</p>
    </div>

    <!-- FLASHCARD -->
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="flashcard-container">
                <div class="flashcard" id="flashcard" style="box-shadow: 0 8px 25px rgba(0,0,0,0.05);">

                    <div class="flashcard-front">
                        <h5 id="cardFront">What is the definition of Machine Learning?</h5>
                    </div>

                    <div class="flashcard-back">
                        <p id="cardBack" class="mb-0">
                            Machine Learning is a subset of AI that enables systems
                            to learn and improve from experience without being explicitly programmed.
                        </p>
                    </div>

                </div>
            </div>

            <!-- NAVIGATION BUTTONS -->
            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-outline-dark" id="prevBtn">Previous</button>
                <button class="btn btn-dark"         id="nextBtn">Next</button>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Load data with cache busting to ensure latest file is used -->
<script>document.write('<script src="flashcards_data.js?v=' + Date.now() + '"><\/script>');</script>
<script>

// ── THEME ──
const html = document.documentElement;
applyTheme(localStorage.getItem('prepmate-theme') || 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');
});
function applyTheme(t) {
    html.setAttribute('data-bs-theme', t);
    localStorage.setItem('prepmate-theme', t);
    document.getElementById('themeIcon').textContent  = t === 'dark' ? '☀️' : '🌙';
    document.getElementById('themeLabel').textContent = t === 'dark' ? 'Light' : 'Dark';
}

// ── FLASHCARDS ──
let flashcards = [];

// 1. Prioritize the latest data from the generated file
if (typeof generatedFlashcards !== 'undefined') {
    flashcards = generatedFlashcards;
} 
// 2. Fallback to localStorage if file data is missing
else {
    const localData = localStorage.getItem('prepmate_data');
    if (localData) {
        const parsed = JSON.parse(localData);
        if (parsed.flashcards) flashcards = parsed.flashcards;
    }
}

if (flashcards.length === 0) {
    flashcards = [
        { front: "What is Machine Learning?", back: "A subset of AI that enables systems to learn from data." },
        { front: "Define Overfitting.", back: "When a model performs well on training data but poorly on new data." },
        { front: "What is Supervised Learning?", back: "A learning approach using labeled training data." }
    ];
}

let currentIndex = 0;

const flashcard = document.getElementById("flashcard");
const cardFront = document.getElementById("cardFront");
const cardBack  = document.getElementById("cardBack");

function loadCard(index) {
    cardFront.textContent = flashcards[index].front;
    cardBack.textContent  = flashcards[index].back;
    flashcard.classList.remove("flip");
}

// Load the first card initially
loadCard(currentIndex);

document.getElementById("nextBtn").addEventListener("click", function() {
    currentIndex = (currentIndex + 1) % flashcards.length;
    loadCard(currentIndex);
});

document.getElementById("prevBtn").addEventListener("click", function() {
    currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
    loadCard(currentIndex);
});

flashcard.addEventListener("click", function() {
    flashcard.classList.toggle("flip");
});

</script>

</body>
</html>
